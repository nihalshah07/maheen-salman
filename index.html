<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salman &amp; Maheen — Save the Date | 30th July 2027</title>
  <meta name="title" content="Salman &amp; Maheen — Save the Date | 30th July 2027" />
  <meta name="description" content="Save the Date — Salman &amp; Maheen are getting married on 30th July 2027. A little dua for our forever." />

  <!-- Open Graph / WhatsApp / Social Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Salman &amp; Maheen — Save the Date" />
  <meta property="og:description" content="We are getting married — 30th July 2027. A little dua for our forever." />
  <meta property="og:image" content="./assets/media/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Salman &amp; Maheen — Save the Date" />
  <meta name="twitter:description" content="We are getting married — 30th July 2027. A little dua for our forever." />
  <meta name="twitter:image" content="./assets/media/og-image.jpg" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/styles.css" />

  <script src="./js/wedding-data.js"></script>
</head>
<body>
  <!-- Background Wedding Audio -->
  <audio id="weiAudio" loop preload="auto" playsinline src="./assets/media/wedding-music.mp3">
    <source src="./assets/media/wedding-music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Embroidered Ribbon Gatefold Overlay -->
  <div id="weiOverlay" role="button" tabindex="0" aria-label="Tap to open wedding invitation">
    <div class="wei-stage">
      <img
        id="weiImg"
        src="./assets/media/ribbon-cover.jpg"
        alt="Silk ribbon-tied floral wedding invitation"
        draggable="false"
      />
      <div id="weiTapWrap">
        <div id="weiTapLabel">Tap to open</div>
      </div>
    </div>
  </div>

  <!-- Ribbon Unfolding & Gatefold Opening Video Transition -->
  <div id="weiVideoWrap" aria-hidden="true">
    <video
      id="weiVideo"
      src="./assets/media/ribbon-open.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- Floating Music Play / Pause Button -->
  <button id="weiAudioBtn" type="button" aria-label="Toggle wedding music">
    <svg id="weiIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: block">
      <rect x="6" y="5" width="4" height="14" rx="1" />
      <rect x="14" y="5" width="4" height="14" rx="1" />
    </svg>
    <svg id="weiIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none">
      <polygon points="5,3 19,12 5,21" />
    </svg>
  </button>

  <main class="page-wrapper">
    <!-- 1. Hero Archway Section -->
    <section id="hero-section" class="artboard-section" aria-label="Save the Date">
      <div class="artboard">
        <!-- Lakeside Arched Pavilion Looping Video -->
        <div id="hero-video-box" class="ab-elem">
          <video id="hero-video" autoplay muted loop playsinline>
            <source id="hero-video-source" src="./assets/media/hero-swans.mp4" type="video/mp4" />
          </video>
        </div>

        <!-- Soft Warm Radial Vignette -->
        <div id="hero-vignette" class="ab-elem" aria-hidden="true"></div>

        <!-- Torn Cream Parchment Transition Edge -->
        <div id="hero-parchment" class="ab-elem" aria-hidden="true">
          <img src="./assets/images/parchment-hero.png" alt="" />
        </div>

        <!-- Save the Date Heading -->
        <div
          id="event-title"
          class="ab-elem"
          data-reveal="fadeinup"
          style="--anim-dur: 2s; --anim-delay: 0.6s; --anim-dist: 30px"
        >
          Save the Date
        </div>

        <!-- Couple Names -->
        <h1
          id="couple-names"
          class="ab-elem"
          data-reveal="fadeinup"
          style="--anim-dur: 2s; --anim-delay: 0.6s; --anim-dist: 30px"
        >
          Salman <br /><br />Maheen
        </h1>

        <div
          id="couple-amp"
          class="ab-elem"
          aria-hidden="true"
          data-reveal="fadeinup"
          style="--anim-dur: 2s; --anim-delay: 0.6s; --anim-dist: 30px"
        >
          &amp;
        </div>

        <!-- Tagline & Date Below Names & Above Scroll Down -->
        <p
          id="married-tagline"
          class="ab-elem"
          data-reveal="fadeinup"
          style="--anim-dur: 2s; --anim-delay: 0.75s; --anim-dist: 24px"
        >
          We are getting married
        </p>

        <p
          id="hero-date"
          class="ab-elem"
          data-reveal="fadeinup"
          style="--anim-dur: 2s; --anim-delay: 0.85s; --anim-dist: 24px"
        >
          30th July 2027
        </p>

        <!-- Gently Swaying Corner Peony Bouquets -->
        <div id="hero-floral-left" class="ab-elem" aria-hidden="true">
          <img src="./assets/images/floral-left.png" alt="" />
        </div>

        <div id="hero-floral-right" class="ab-elem" aria-hidden="true">
          <img src="./assets/images/floral-right.png" alt="" />
        </div>

        <div id="hero-glow" class="ab-elem" aria-hidden="true">
          <img src="./assets/images/hero-glow.png" alt="" />
        </div>

        <!-- Scroll Cue -->
        <div id="scroll-label" class="ab-elem">Scroll down</div>

        <div id="scroll-chevron" class="ab-elem" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25.00 15.86" role="img" aria-label="">
            <path
              fill="none"
              stroke="#937100"
              stroke-width="1"
              stroke-linecap="round"
              d="M1.0092 1.008C4.3691 5.4431 9.1402 9.565 12.5 14C16.8007 9.565 19.6901 5.4431 23.9908 1.008"
            />
          </svg>
        </div>
      </div>
    </section>

    <!-- 2. Countdown, Dua Quote & Wedding Date Section -->
    <section id="celebration-section" aria-labelledby="countdown-heading">
      <div class="celebration-inner">
        <h2
          id="countdown-heading"
          data-reveal="fadeinup"
          style="--anim-dur: 1.4s; --anim-dist: 24px"
        >
          The Celebration Begins In
        </h2>

        <div
          id="countdown-box"
          data-reveal="fadeinup"
          style="--anim-dur: 1.2s; --anim-dist: 40px"
        >
          <div id="countdownContainer">
            <div class="time-block" id="tb-days">
              <div class="number-wrap"><div class="number" id="days">00</div></div>
              <div class="label">Days</div>
            </div>
            <div class="separator sep1">:</div>
            <div class="time-block" id="tb-hours">
              <div class="number-wrap"><div class="number" id="hours">00</div></div>
              <div class="label">Hours</div>
            </div>
            <div class="separator sep2">:</div>
            <div class="time-block" id="tb-mins">
              <div class="number-wrap"><div class="number" id="minutes">00</div></div>
              <div class="label">Minutes</div>
            </div>
            <div class="separator sep3">:</div>
            <div class="time-block" id="tb-secs">
              <div class="number-wrap"><div class="number" id="seconds">00</div></div>
              <div class="label">Seconds</div>
            </div>
          </div>
        </div>

        <div
          class="blessing-closing"
          data-reveal="fadeinup"
          style="--anim-dur: 1.6s; --anim-delay: 0.15s; --anim-dist: 28px"
        >
          <p id="closing-quote">A little dua for our forever</p>
          <div class="closing-divider" aria-hidden="true"></div>
          <p id="closing-date">30th July 2027</p>
          <img
            src="./assets/images/card-flourish-bottom.png"
            class="closing-flourish"
            alt=""
            aria-hidden="true"
          />
        </div>
      </div>
    </section>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
